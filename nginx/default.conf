upstream api {                       # two backend instances sharing one database
    server api1:5000 max_fails=2 fail_timeout=5s;
    server api2:5000 max_fails=2 fail_timeout=5s;
}
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        # Re-sending a POST to the other instance is safe ONLY because every write is idempotent
        # (Idempotency-Key, UNIQUE source refs, optimistic versions), hence 'non_idempotent' is enabled deliberately.
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
    }
    location / { try_files $uri /index.html; }
}
